name: 功能建议 / Feature Request
description: 为 AiMusic 提出新的功能构想或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢为 AiMusic 提出改进建议！请先查阅 [REQUIREMENTS.md](docs/REQUIREMENTS.md) 与 [ROADMAP.md](docs/ROADMAP.md) 查看是否已有对应规划。
  - type: textarea
    id: problem
    attributes:
      label: 需求背景 / 遇到的问题 (Problem Description)
      description: 请清晰描述您希望解决的问题场景
      placeholder: 当我在管理曲库或听歌时，发现...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案 (Proposed Solution)
      description: 请描述您期望的功能行为或实现方式
      placeholder: 希望增加一个功能，可以...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 (Alternatives Considered)
      description: 您是否考虑过其他现有的解决方式或工具？
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: 其他补充信息 (Additional Context)
      description: 相关的参考资料、原型草图、竞品对比等
    validations:
      required: false
